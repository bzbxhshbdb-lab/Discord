<!DOCTYPE html>  <html lang="pt-BR">  
<head>  
  <meta charset="UTF-8">  
  <title>ZXiter Trick</title>  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">    <!-- PWA -->    <link rel="manifest" href="manifest.json">  
  <meta name="theme-color" content="#FFD700">    <!-- CSS -->    <link rel="stylesheet" href="style.css">    <!-- JSZip para download do connect -->    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>  </head>  
<body>  <div class="panel">  
  <h1>ZXiter <span>Trick</span></h1>  
  <p class="subtitle">Painel Avançado Unity</p>    <!-- ABAS -->    <div class="tabs">  
    <button class="tab active" data-tab="performance">Performance</button>  
    <button class="tab" data-tab="gameplay">Gameplay</button>  
    <button class="tab" data-tab="system">Sistema</button>  
    <button class="tab" data-tab="sensitivity">Sensibilidade</button>  
  </div>    <!-- PERFORMANCE -->    <div class="content active" id="performance">  
    <label><input type="checkbox" data-key="antilag"> Anti-Lag</label>  
    <label><input type="checkbox" data-key="pingBoost"> Ping Boost</label>  
    <label><input type="checkbox" data-key="fpsBoost"> FPS Boost</label>  
    <label><input type="checkbox" data-key="reduceDelay"> Reduzir Delay</label>  
    <label><input type="checkbox" data-key="lowLatency"> Baixa Latência</label>  
  </div>    <!-- GAMEPLAY -->    <div class="content" id="gameplay">  
    <label><input type="checkbox" data-key="aimAssist"> Aim Assist</label>  
    <label><input type="checkbox" data-key="aimLock"> Aim Lock</label>  
    <label><input type="checkbox" data-key="aimbot"> Aimbot (Study)</label>  
    <label><input type="checkbox" data-key="weaponStability"> Estabilidade</label>  
    <label><input type="checkbox" data-key="dynamicPrecision"> Precisão</label>  
    <label><input type="checkbox" data-key="recoilControl"> Controle de Recuo</label>  <label>  
  Alvo Prioritário  
  <select id="target">  
    <option value="head">Cabeça</option>  
    <option value="neck">Pescoço</option>  
    <option value="body">Corpo</option>  
  </select>  
</label>

  </div>    <!-- SISTEMA -->    <div class="content" id="system">  
    <label><input type="checkbox" data-key="advancedSync"> Sincronização Avançada</label>  
    <label><input type="checkbox" data-key="smartCache"> Cache Inteligente</label>  
    <label><input type="checkbox" data-key="processPriority"> Prioridade de Processo</label>  
    <label><input type="checkbox" data-key="debugMode"> Debug</label>  
  </div>    <!-- SENSIBILIDADE -->    <div class="content" id="sensitivity">  
    <label>X <input type="number" id="sensX" min="1" max="100" value="50"></label>  
    <label>Y <input type="number" id="sensY" min="1" max="100" value="50"></label>  
    <label>Z <input type="number" id="sensZ" min="1" max="100" value="50"></label>  
  </div>    <!-- BOTÕES -->  <button id="apply">APLICAR CONFIGURAÇÕES</button>
<button id="downloadData">DOWNLOAD CONNECT</button>
<button id="export">EXPORTAR CONFIG</button>
<button id="reset">RESETAR PAINEL</button>

  <!-- MEDIDORES -->
<div class="meters">

  <div class="meter">
    <span>🎯 Taxa de HS</span>
    <div class="bar">
      <div class="fill" id="hsMeter"></div>
    </div>
    <small id="hsValue">0%</small>
  </div>

  <div class="meter">
    <span>⚙️ Taxa de Otimização</span>
    <div class="bar">
      <div class="fill" id="optMeter"></div>
    </div>
    <small id="optValue">0%</small>
  </div>

  <div class="meter">
    <span>🎚️ Taxa de Sensibilidade</span>
    <div class="bar">
      <div class="fill" id="sensMeter"></div>
    </div>
    <small id="sensValue">0%</small>
  </div>

</div>  <!-- SCRIPT -->  <script src="script.js"></script>  </body>  
</html>
