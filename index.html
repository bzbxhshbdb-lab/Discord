<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Free Fire Max</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Free Fire <span>Max</span></h1>
  <p class="subtitle">ZXiter Trick</p>
</header>

<nav>
  <button onclick="openTab('precision')">Precisão</button>
  <button onclick="openTab('stability')">Estabilidade</button>
  <button onclick="openTab('recoil')">Recuo</button>
</nav>

<section id="precision" class="tab">
  <h2>Precisão</h2>
  <label>Precisão Geral</label>
  <input type="range" min="0" max="100" value="80" id="precisionValue">
</section>

<section id="stability" class="tab">
  <h2>Estabilidade</h2>
  <label>Estabilidade da Mira</label>
  <input type="range" min="0" max="100" value="75" id="stabilityValue">
</section>

<section id="recoil" class="tab">
  <h2>Recuo</h2>
  <label>Controle de Recuo</label>
  <input type="range" min="0" max="100" value="70" id="recoilValue">
</section>

<footer>
  <button onclick="saveConfig()">Salvar</button>
  <button onclick="exportConfig()">Exportar Config</button>
</footer>

<script src="script.js"></script>
</body>
</html>
