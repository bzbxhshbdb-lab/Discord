<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Free Fire Max</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFD700">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="panel">
  <h1>Free Fire <span>Max</span></h1>
  <p class="subtitle">ZXiter Trick</p>

  <!-- Abas -->
  <div class="tabs">
    <button class="tab active" data-tab="performance">Performance</button>
    <button class="tab" data-tab="gameplay">Gameplay</button>
    <button class="tab" data-tab="system">Sistema</button>
    <button class="tab" data-tab="sensitivity">Sensibilidade</button>
  </div>

  <!-- Performance -->
  <div class="content active" id="performance">
    <label><input type="checkbox" data-key="antilag"> Anti-Lag</label>
    <label><input type="checkbox" data-key="pingBoost"> Ping Melhorado</label>
    <label><input type="checkbox" data-key="fpsBoost"> Otimização de FPS</label>
    <label><input type="checkbox" data-key="reduceDelay"> Redução de Delay</label>
    <label><input type="checkbox" data-key="lowLatency"> Baixa Latência</label>
  </div>

  <!-- Gameplay -->
  <div class="content" id="gameplay">
    <label><input type="checkbox" data-key="aimAssist"> Assistência de Mira</label>
    <label><input type="checkbox" data-key="aimLock"> Aim Lock</label>
    <label><input type="checkbox" data-key="aimbot"> Aimbot</label>
    <label><input type="checkbox" data-key="weaponStability"> Estabilidade</label>
    <label><input type="checkbox" data-key="dynamicPrecision"> Precisão</label>
    <label><input type="checkbox" data-key="recoilControl"> Recuo</label>
    <select id="target">
      <option value="head">Cabeça</option>
      <option value="neck">Pescoço</option>
      <option value="body">Corpo</option>
    </select>
  </div>

  <!-- Sistema -->
  <div class="content" id="system">
    <label><input type="checkbox" data-key="advancedSync"> Sincronização</label>
    <label><input type="checkbox" data-key="smartCache"> Cache</label>
    <label><input type="checkbox" data-key="processPriority"> Prioridade</label>
    <label><input type="checkbox" data-key="debugMode"> Debug</label>
  </div>

  <!-- Sensibilidade -->
  <div class="content" id="sensitivity">
    <label>X: <input type="number" id="sensX" value="50" min="0" max="100"></label>
    <label>Y: <input type="number" id="sensY" value="50" min="0" max="100"></label>
    <label>Z: <input type="number" id="sensZ" value="50" min="0" max="100"></label>
  </div>

  <button id="apply">APLICAR CONFIGURAÇÕES</button>
  <button id="export">EXPORTAR CONFIGURAÇÃO</button>
  <button id="reset">RESETAR PAINEL</button>
</div>

<script>
// =========================
// UNITY BRIDGE SIMULADA
// =========================
if(!window.Unity) window.Unity={call:data=>console.log("Config enviada para Unity:",data)};

// =========================
// ABAS
// =========================
const tabs=document.querySelectorAll(".tab");
const contents=document.querySelectorAll(".content");
tabs.forEach(tab=>{
  tab.addEventListener("click",()=>{
    tabs.forEach(t=>t.classList.remove("active"));
    contents.forEach(c=>c.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(tab.dataset.tab).classList.add("active");
  });
});

// =========================
// COLETAR CONFIGURAÇÃO
// =========================
function collectSettings(){
  const config={};
  document.querySelectorAll("input[type=checkbox]").forEach(cb=>{
    config[cb.dataset.key]=cb.checked;
  });
  config.target=document.getElementById("target").value;
  config.sensitivity={
    x:parseFloat(document.getElementById("sensX").value),
    y:parseFloat(document.getElementById("sensY").value),
    z:parseFloat(document.getElementById("sensZ").value)
  };
  return config;
}

// =========================
// AIM ASSIST AVANÇADO
// =========================
function buildAimAssist(settings){
  if(!settings.aimAssist&&!settings.aimLock&&!settings.aimbot) return {enabled:false};
  return {
    enabled:settings.aimAssist||settings.aimLock||settings.aimbot,
    magnetism:settings.aimAssist?0.85:0,
    slowdown:settings.aimAssist?0.5:0,
    correction:settings.aimAssist?0.8:0,
    baseFov:8,
    minFov:4,
    dynamicFov:true,
    priority:settings.target||"head",
    autoRotate:false,
    snap:false,
    aimLock:settings.aimLock?{enabled:true,strength:0.8,releaseDelayMs:120}:{enabled:false},
    aimbot:settings.aimbot?{enabled:true,mode:"logical",smoothing:0.9}:{enabled:false}
  };
}

// =========================
// GAMEPLAY EXTREMO
// =========================
function buildGameplay(settings){
  return {
    precision:settings.dynamicPrecision?1:0.9,
    stability:settings.weaponStability?1:0.9,
    recoil:settings.recoilControl?0.01:0.2,
    aimAssist:buildAimAssist(settings),
    sensitivity:settings.sensitivity
  };
}

// =========================
// APLICAR CONFIGURAÇÃO
// =========================
document.getElementById("apply").addEventListener("click",()=>{
  const settings=collectSettings();
  const finalConfig={
    app:"ZXiter Trick",
    displayName:"Free Fire Max",
    package:"com.dts.freefiremax",
    performance:{
      antilag:settings.antilag,
      pingBoost:settings.pingBoost,
      fpsBoost:settings.fpsBoost,
      reduceDelay:settings.reduceDelay,
      lowLatency:settings.lowLatency
    },
    gameplay:buildGameplay(settings),
    system:{
      advancedSync:settings.advancedSync,
      smartCache:settings.smartCache,
      processPriority:settings.processPriority,
      debugMode:settings.debugMode
    }
  };
  if(window.Unity) window.Unity.call(JSON.stringify(finalConfig));
  localStorage.setItem("zxiter_config",JSON.stringify(finalConfig));
  alert("Assistência de mira aplicada.");
});

// =========================
// EXPORTAR CONFIGURAÇÃO
// =========================
document.getElementById("export").addEventListener("click",()=>{
  const config=localStorage.getItem("zxiter_config");
  if(!config){alert("Nenhuma configuração salva para exportar."); return;}
  const blob=new Blob([config],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="zxiter_aim_config.json";
  a.click();
  URL.revokeObjectURL(url);
});

// =========================
// RESETAR PAINEL
// =========================
document.getElementById("reset").addEventListener("click",()=>{
  document.querySelectorAll("input[type=checkbox]").forEach(cb=>cb.checked=false);
  document.getElementById("target").value="head";
  document.getElementById("sensX").value=50;
  document.getElementById("sensY").value=50;
  document.getElementById("sensZ").value=50;
  localStorage.removeItem("zxiter_config");
  alert("Painel resetado e configurações removidas.");
});

// =========================
// LOAD CONFIGURAÇÃO SALVA
// =========================
window.addEventListener("load",()=>{
  const saved=localStorage.getItem("zxiter_config");
  if(!saved) return;
  const cfg=JSON.parse(saved);
  const aim=cfg.gameplay?.aimAssist||{};
  document.querySelectorAll("input[type=checkbox]").forEach(cb=>{
    const key=cb.dataset.key;
    cb.checked=!!cfg.performance[key]||!!cfg.system[key]||!!aim[key];
  });
  document.getElementById("target").value=aim.priority||"head";
  if(cfg.gameplay?.sensitivity){
    document.getElementById("sensX").value=cfg.gameplay.sensitivity.x;
    document.getElementById("sensY").value=cfg.gameplay.sensitivity.y;
    document.getElementById("sensZ").value=cfg.gameplay.sensitivity.z;
  }
});

// =========================
// REGISTRAR SERVICE WORKER
// =========================
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js')
      .then(()=>console.log("Service Worker registrado"))
      .catch(err=>console.error("SW erro:",err));
  });
}
</script>
</body>
</html>
